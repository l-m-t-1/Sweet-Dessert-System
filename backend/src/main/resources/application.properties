# 应用名称
spring.application.name=dessert-system

spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# MySQL 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/dessert_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# MyBatis Plus SQL 日志
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads
app.jwt-secret=${JWT_SECRET}
app.jwt-ttl=PT2H
